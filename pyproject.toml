[project]
name = "deep-researcher"
version = "0.1.0"
description = "Autonomous deep research agent with verifiable citations, SSE live UI, and Laya as System-1 decision engine."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "pypdf>=4.2",
]

[project.optional-dependencies]
laya = ["laya>=0.3.21"]
server = ["fastapi>=0.111", "uvicorn>=0.30", "sse-starlette>=2.1", "fpdf2>=2.7"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: tests hitting the real network (deselect with -m 'not live')"]
